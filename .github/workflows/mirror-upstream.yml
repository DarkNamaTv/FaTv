name: Mirror upstream feed

# Keeps an in-repo copy of the encrypted mytvsat feed (mirror/posts + mirror/v2-posts)
# so no consumer needs a third-party host: the scraper reads the local files and
# remote clients fetch them from this repo's raw URLs. Upstream refreshes
# about twice a day, hence the schedule below.
on:
  schedule:
    - cron: '23 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch encrypted upstream files
        run: |
          set -euo pipefail
          mkdir -p mirror
          fetch_one() {
            local src="$1" dest="$2"
            rm -f "$dest"
            curl -fsSL --retry 2 --max-time 120 "https://raw.githubusercontent.com/mytvsat/webservice/main/${src}" -o "$dest" \
              || curl -fsSL --retry 2 --max-time 120 "https://cdn.jsdelivr.net/gh/mytvsat/webservice@main/${src}" -o "$dest"
            local size
            size=$(wc -c < "$dest")
            if [ "$size" -lt 10240 ]; then
              echo "ERROR: $dest too small ($size bytes), refusing to mirror" >&2
              exit 1
            fi
            echo "mirrored $src -> $dest ($size bytes)"
          }
          fetch_one posts mirror/posts
          fetch_one v2/posts mirror/v2-posts

      - name: Commit mirror if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirror/posts mirror/v2-posts
          if git diff --cached --quiet; then
            echo "Mirror unchanged."
            exit 0
          fi
          git commit -m "chore(mirror): refresh encrypted upstream feed [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
